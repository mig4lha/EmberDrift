name: EmberDrift
options:
  bundleIdPrefix: com.emberdrift
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  EmberDrift:
    type: application
    platform: iOS
    sources:
      - path: EmberDrift
    settings:
      base:
        INFOPLIST_FILE: EmberDrift/Info.plist
    dependencies: []
    info:
      path: EmberDrift/Info.plist
      properties:
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - armv7
